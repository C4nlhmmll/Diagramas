<body><div class="mxgraph" style="max-width:100%;border:1px solid transparent;" data-mxgraph="{&quot;highlight&quot;:&quot;#0000ff&quot;,&quot;nav&quot;:true,&quot;resize&quot;:true,&quot;dark-mode&quot;:&quot;auto&quot;,&quot;toolbar&quot;:&quot;zoom layers tags lightbox&quot;,&quot;edit&quot;:&quot;_blank&quot;,&quot;xml&quot;:&quot;&lt;mxfile host=\&quot;app.diagrams.net\&quot;&gt;\n  &lt;diagram name=\&quot;Page-1\&quot; id=\&quot;HaZrnxkfOlbdEMbSknSa\&quot;&gt;\n    &lt;mxGraphModel dx=\&quot;7350\&quot; dy=\&quot;5720\&quot; grid=\&quot;1\&quot; gridSize=\&quot;10\&quot; guides=\&quot;1\&quot; tooltips=\&quot;1\&quot; connect=\&quot;1\&quot; arrows=\&quot;1\&quot; fold=\&quot;1\&quot; page=\&quot;1\&quot; pageScale=\&quot;1\&quot; pageWidth=\&quot;850\&quot; pageHeight=\&quot;1100\&quot; math=\&quot;0\&quot; shadow=\&quot;0\&quot; adaptiveColors=\&quot;auto\&quot;&gt;\n      &lt;root&gt;\n        &lt;mxCell id=\&quot;0\&quot; /&gt;\n        &lt;mxCell id=\&quot;1\&quot; parent=\&quot;0\&quot; /&gt;\n        &lt;mxCell id=\&quot;YctG1OoLwg0fGqmZctv6-3\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;whiteSpace=wrap;overflow=hidden;rounded=1;\&quot; value=\&quot;&amp;lt;h1 style=&amp;quot;margin-top: 0px;&amp;quot;&amp;gt;Como vai fucionar esse &amp;quot;super fluxo&amp;quot;?&amp;lt;/h1&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;p data-start=&amp;quot;190&amp;quot; data-end=&amp;quot;401&amp;quot;&amp;gt;O fluxo do produto é baseado no conceito de CRUD (Create, Read, Update e Delete). No entanto, não se trata de um CRUD tradicional e técnico, e sim de um processo controlado por estados, validações e integrações.&amp;lt;br&amp;gt;&amp;lt;span style=&amp;quot;background-color: transparent; color: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;&amp;lt;br&amp;gt;Ou seja:&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;ul data-start=&amp;quot;413&amp;quot; data-end=&amp;quot;888&amp;quot;&amp;gt;&amp;lt;li data-section-id=&amp;quot;8mxqy5&amp;quot; data-start=&amp;quot;413&amp;quot; data-end=&amp;quot;541&amp;quot;&amp;gt;&amp;lt;strong data-start=&amp;quot;415&amp;quot; data-end=&amp;quot;433&amp;quot;&amp;gt;Create (Criar)&amp;lt;/strong&amp;gt; não significa apenas inserir um produto, mas garantir que ele entre no sistema em um estado válido inicial.&amp;lt;br&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;br&amp;gt;&amp;lt;li data-section-id=&amp;quot;4ej6o1&amp;quot; data-start=&amp;quot;542&amp;quot; data-end=&amp;quot;695&amp;quot;&amp;gt;&amp;lt;strong data-start=&amp;quot;544&amp;quot; data-end=&amp;quot;566&amp;quot;&amp;gt;Update (Atualizar)&amp;lt;/strong&amp;gt; não é apenas editar informações, mas sim validar alterações e garantir que o produto continue consistente em todos os contextos.&amp;lt;br&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;br&amp;gt;&amp;lt;li data-section-id=&amp;quot;10kgnaq&amp;quot; data-start=&amp;quot;696&amp;quot; data-end=&amp;quot;805&amp;quot;&amp;gt;&amp;lt;strong data-start=&amp;quot;698&amp;quot; data-end=&amp;quot;718&amp;quot;&amp;gt;Delete (Excluir)&amp;lt;/strong&amp;gt; deve respeitar regras de negócio, evitando remoções que possam causar inconsistências.&amp;lt;br&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;br&amp;gt;&amp;lt;li data-section-id=&amp;quot;nehwhv&amp;quot; data-start=&amp;quot;806&amp;quot; data-end=&amp;quot;888&amp;quot;&amp;gt;&amp;lt;strong data-start=&amp;quot;808&amp;quot; data-end=&amp;quot;828&amp;quot;&amp;gt;Read (Consultar)&amp;lt;/strong&amp;gt; deve refletir sempre o estado real e atualizado do produto.&amp;lt;br&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;br&amp;gt;&amp;lt;p data-start=&amp;quot;890&amp;quot; data-end=&amp;quot;1050&amp;quot;&amp;gt;Além disso, todo o fluxo é orientado por estados bem definidos. Cada ação realizada sobre o produto provoca uma transição de estado, que é previamente validada.&amp;lt;/p&amp;gt;&amp;lt;/div&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;360\&quot; width=\&quot;690\&quot; x=\&quot;35\&quot; y=\&quot;-1060\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;YctG1OoLwg0fGqmZctv6-4\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;whiteSpace=wrap;overflow=hidden;rounded=1;\&quot; value=\&quot;&amp;lt;h1 style=&amp;quot;margin-top: 0px;&amp;quot;&amp;gt;Leitura do fluxo&amp;lt;/h1&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;p data-start=&amp;quot;142&amp;quot; data-end=&amp;quot;278&amp;quot;&amp;gt;Para facilitar a compreensão do fluxo, as ações foram separadas de acordo com sua origem: ações do usuário (cliente) e ações do sistema.&amp;lt;/p&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;p data-start=&amp;quot;280&amp;quot; data-end=&amp;quot;526&amp;quot;&amp;gt;Cada tipo de ação é representado por cores e formatos diferentes no diagrama. Essa distinção foi adotada para tornar a leitura mais intuitiva, evitando a necessidade de analisar detalhadamente cada etapa para entender quem está executando a ação.&amp;lt;/p&amp;gt;&amp;lt;/div&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;220\&quot; width=\&quot;510\&quot; x=\&quot;810\&quot; y=\&quot;-1060\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;YctG1OoLwg0fGqmZctv6-22\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;whiteSpace=wrap;overflow=hidden;rounded=1;\&quot; value=\&quot;&amp;lt;h1 style=&amp;quot;margin-top: 0px;&amp;quot;&amp;gt;Status do produto:&amp;lt;/h1&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;p data-start=&amp;quot;124&amp;quot; data-end=&amp;quot;238&amp;quot;&amp;gt;O produto possui um status próprio, utilizado para informar ao usuário a situação atual do item dentro do sistema.&amp;lt;/p&amp;gt;&amp;lt;p data-start=&amp;quot;240&amp;quot; data-end=&amp;quot;272&amp;quot;&amp;gt;Esse status indica, por exemplo:&amp;lt;/p&amp;gt;&amp;lt;ul data-start=&amp;quot;273&amp;quot; data-end=&amp;quot;478&amp;quot;&amp;gt;&amp;lt;li data-section-id=&amp;quot;1rbp1dr&amp;quot; data-start=&amp;quot;273&amp;quot; data-end=&amp;quot;330&amp;quot;&amp;gt;se o produto foi publicado em todos os canais de venda;&amp;lt;/li&amp;gt;&amp;lt;li data-section-id=&amp;quot;xkc1ej&amp;quot; data-start=&amp;quot;331&amp;quot; data-end=&amp;quot;374&amp;quot;&amp;gt;se foi publicado apenas em alguns canais;&amp;lt;br&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;br&amp;gt;&amp;lt;li data-section-id=&amp;quot;k6wl21&amp;quot; data-start=&amp;quot;375&amp;quot; data-end=&amp;quot;442&amp;quot;&amp;gt;se apresenta inconsistências ou erros que impedem sua publicação;&amp;lt;/li&amp;gt;&amp;lt;li data-section-id=&amp;quot;vz6jlx&amp;quot; data-start=&amp;quot;443&amp;quot; data-end=&amp;quot;478&amp;quot;&amp;gt;entre outros cenários relevantes.&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;p data-start=&amp;quot;480&amp;quot; data-end=&amp;quot;611&amp;quot;&amp;gt;O objetivo é fornecer uma visão rápida e clara do estado do produto, facilitando a identificação de pendências e ações necessárias.&amp;lt;/p&amp;gt;&amp;lt;/div&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;250\&quot; width=\&quot;710\&quot; x=\&quot;25\&quot; y=\&quot;-540\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;YctG1OoLwg0fGqmZctv6-23\&quot; parent=\&quot;1\&quot; style=\&quot;verticalLabelPosition=bottom;verticalAlign=top;html=1;shape=hexagon;perimeter=hexagonPerimeter2;arcSize=6;size=0.27;strokeColor=light-dark(#000000,#66FFFF);rounded=1;\&quot; value=\&quot;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;50\&quot; width=\&quot;90\&quot; x=\&quot;60\&quot; y=\&quot;-260\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;YctG1OoLwg0fGqmZctv6-24\&quot; parent=\&quot;1\&quot; style=\&quot;ver
